# Whole stack:  docker compose up --build   →  http://localhost:8080
# Only databases (for local development):  docker compose up -d mongo redis
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  api:
    build: ./Backend
    restart: unless-stopped
    depends_on: [mongo, redis]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: 1
      MONGODB_URI: mongodb://mongo:27017/url_shortener
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Trimly <noreply@example.com>}
      SENTRY_DSN: ${SENTRY_DSN:-}

  web:
    build: ./Frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  mongo-data:
  redis-data:
